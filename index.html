<script>
/* ================= SIMULATION ENGINE (no DOM access) ================= */
const N='X';
const GT={and:(a,b)=>a===0||b===0?0:a===1&&b===1?1:N,or:(a,b)=>a===1||b===1?1:a===0&&b===0?0:N,xor:(a,b)=>a===N||b===N?N:a^b,not:a=>a===N?N:1-a};
GT.nand=(a,b)=>GT.not(GT.and(a,b));GT.nor=(a,b)=>GT.not(GT.or(a,b));GT.xnor=(a,b)=>GT.not(GT.xor(a,b));
const Q=[[1,2,3],[4,5,6],[9,10,8],[12,13,11]]; // [inA,inB,out] per gate, from the datasheet
const ICS={7400:{fn:'nand',g:Q,d:'Quad 2-input NAND'},7402:{fn:'nor',g:[[2,3,1],[5,6,4],[8,9,10],[11,12,13]],d:'Quad 2-input NOR'},
7404:{fn:'not',g:[[1,2],[3,4],[5,6],[9,8],[11,10],[13,12]],d:'Hex inverter'},7408:{fn:'and',g:Q,d:'Quad 2-input AND'},
7432:{fn:'or',g:Q,d:'Quad 2-input OR'},7486:{fn:'xor',g:Q,d:'Quad 2-input XOR'}};
const SW_=['A','B','C','D'],LEDS=['Y1','Y2','Y3','Y4'];
const PINS=[1,2,3,4].flatMap(n=>['P5.'+n,'G.'+n]).concat(SW_.map(k=>'SW.'+k),LEDS.map(k=>'LED.'+k));
for(let s=1;s<=3;s++)for(let p=1;p<=14;p++)PINS.push(`S${s}.${p}`);
const HOLES=[];for(let c=1;c<=30;c++)for(const r of'abcdefghij')HOLES.push(`H.${c}${r}`);
for(let r=1;r<=4;r++)for(let n=1;n<=25;n++)HOLES.push(`R${r}.${n}`);
const ALL=new Set([...PINS,...HOLES]);
function netFinder(wires,st){ // union-find: wired pins and all +5V / GND jacks share a node
 const par={},f=x=>{if(par[x]===undefined)par[x]=x;return par[x]===x?x:(par[x]=f(par[x]))};
 const u=(a,b)=>{par[f(a)]=f(b)};wires.forEach(w=>u(w[0],w[1]));
 for(let n=2;n<=4;n++){u('P5.1','P5.'+n);u('G.1','G.'+n)}
 if(st&&st.bb){ // breadboard: a-e and f-j of each column are joined; each rail row is one line
  for(let c=1;c<=30;c++)for(const[r0,rs]of[['a','bcde'],['f','ghij']])for(const r of rs)u(`H.${c}${r0}`,`H.${c}${r}`);
  for(let r=1;r<=4;r++)for(let n=2;n<=25;n++)u(`R${r}.1`,`R${r}.${n}`);

on('#bSop',()=>{const[ins,outs]=wired();if(!ins.length||!outs.length){toast('Wire a switch and an LED first');return}
 const R=rowsOf(ins,outs);let h='';outs.forEach((y,j)=>{if(R.some(r=>r.o[j]!==0&&r.o[j]!==1)){h+=`<p><b>${y}</b> = unknown. The output is X for some input rows, so no expression can be read. Check the Warnings panel (power, floating inputs, conflicts).</p>`;return}const t=R.filter(r=>r.o[j]===1).map(r=>ins.map(k=>r.s2[k]?k:k+"'").join('·'));
  const q=R.filter(r=>r.o[j]===1).map(r=>'('+ins.map(k=>r.s2[k]?k:'NOT '+k).join(' AND ')+')'),pe=y+' = '+(q.length===0?'0':q.length===R.length?'1':q.join(' OR '));
  h+=`<p><b>${y}</b> = ${t.length===0?'0':t.length===R.length?'1':t.join(' + ')}<button class="cp" data-copy="${pe}" title="Copy in Expected-output format">Copy</button></p>`});
 dlg('Boolean expression','<p class="lg">Sum of products read from your circuit’s truth table (A\' means NOT A, · means AND, + means OR).</p>'+h+'<p class="lg">Paste it into “Expected output” using AND, OR, NOT to check your design.</p>')});
function trace(){const box=$('#trc'),dt=$('#trd');trc.clear();if(!box||!dt||!dt.open)return;
 const f=sim.f,v=sim.nv,G=[];st.ics.forEach((t,i)=>{if(t)ICS[t].g.forEach((g,gi)=>G.push({ic:i+1,t,fn:ICS[t].fn,n:gi+1,g,o:g[g.length-1],key:(i+1)+'.'+gi}))});
 const outs=LEDS.filter(y=>st.wires.some(w=>w.includes('LED.'+y)));
 if(!outs.length){box.innerHTML='<p class="lg">Wire an LED to see how its signal is made, gate by gate.</p>';return}
 const order=[],seen=new Set(),bd=x=>`<span class="tb ${x===1?'h':x===0?'l':'x'}">${x}</span>`;
 const node=(pin,lab,path)=>{const val=v(pin),r=f(pin);let desc,kids='';
  if(r===f('P5.1'))desc='+5V supply';else if(r===f('G.1'))desc='GND';
  else{const k=SW_.find(k=>f('SW.'+k)===r);
   if(k){desc='Switch '+k;trc.add('SW.'+k)}
   else{const g=G.find(g=>f(`S${g.ic}.${g.o}`)===r);
    if(!g)desc='<small>not driven</small>';
    else if(path.includes(g.key))desc='<small>feedback loop</small>';
    else{const ins=g.g.slice(0,-1),sub=ins.map(p=>node(`S${g.ic}.${p}`,'pin '+p,[...path,g.key]));
     trc.add(`S${g.ic}.${g.o}`);ins.forEach(p=>trc.add(`S${g.ic}.${p}`));
     if(!seen.has(g.key)){seen.add(g.key);order.push({g,i:ins.map(p=>v(`S${g.ic}.${p}`)),o:v(`S${g.ic}.${g.o}`)})}
     desc=`<b>${g.fn.toUpperCase()}</b> · IC${g.ic} ${g.t}, gate ${g.n}`;kids='<ul>'+sub.join('')+'</ul>'}}}
  return`<li>${bd(val)} <small>${lab} ←</small> ${desc}${kids}</li>`};
 const trees=outs.map(y=>{trc.add('LED.'+y);return'<ul class="tr">'+node('LED.'+y,'LED '+y,[])+'</ul>'}).join('');
 box.innerHTML=trees+(order.length?'<p class="lg">Evaluation order</p><ol class="tr">'+order.map(o=>`<li>${o.g.fn.toUpperCase()}(${o.i.join(', ')}) → ${bd(o.o)} <small>IC${o.g.ic} gate ${o.g.n}</small></li>`).join('')+'</ol><p class="lg">Amber pins on the board belong to this trace.</p>':'<p class="lg">No gates here: the LED connects straight to a switch or supply.</p>')}
on('#bTrc',()=>{const d=$('#trd');d.open=!d.open;$('#bTrc').setAttribute('aria-pressed',d.open);if(d.open){$('#right').classList.remove('off');d.scrollIntoView({block:'nearest'})}render()});

const copyT=t=>{const ok=()=>toast('Copied to clipboard'),fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(y){prompt('Copy this link',t)}a.remove()};try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}};

on('#bStep',()=>{const[ins]=wired();if(!ins.length){toast('Wire at least one switch first');return}let n=0;ins.forEach((k,j)=>n|=(sw[k]?1:0)<<(ins.length-1-j));n=(n+1)%(1<<ins.length);ins.forEach((k,j)=>sw[k]=(n>>(ins.length-1-j))&1);render();toast('Inputs '+ins.join('')+' = '+ins.map(k=>sw[k]).join(''))});

const cmd=document.createElement('div');cmd.id='cmd';cmd.hidden=true;cmd.innerHTML='<div role="dialog" aria-modal="true" aria-label="Command palette"><input id="cmi" placeholder="Type an action, e.g. timing, zoom, share…" aria-label="Search actions" autocomplete="off"><ul id="cml"></ul></div>';document.body.appendChild(cmd);
let cmI=0,cmL=[];
const cmDraw=()=>{const q=$('#cmi').value.toLowerCase().trim();cmL=[...document.querySelectorAll('header button[id]')].filter(b=>b.id!=='bCmd'&&!b.disabled).map(b=>({b,t:(b.textContent+' '+(b.title||'')).toLowerCase(),n:b.textContent.trim(),g:(b.closest('.grp')||b).getAttribute('aria-label')||'Toolbar'})).filter(o=>!q||q.split(' ').every(w=>o.t.includes(w)));cmI=Math.min(cmI,Math.max(0,cmL.length-1));$('#cml').innerHTML=cmL.map((o,i)=>`<li data-i="${i}" class="${i===cmI?'on':''}"><span>${esc(o.n)}</span><small>${esc(o.g)}</small></li>`).join('')||'<li><small>No matching action</small></li>'};
const cmOpen=()=>{cmd.hidden=false;$('#cmi').value='';cmI=0;cmDraw();$('#cmi').focus()},cmClose=()=>{cmd.hidden=true},cmRun=i=>{const o=cmL[i];if(o){cmClose();o.b.click()}};
on('#bCmd',cmOpen);$('#cmi').addEventListener('input',()=>{cmI=0;cmDraw()});
$('#cmi').addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();cmI=(cmI+(e.key==='ArrowDown'?1:-1)+cmL.length)%Math.max(1,cmL.length);cmDraw();const a=$('#cml .on');a&&a.scrollIntoView({block:'nearest'})}else if(e.key==='Enter'){e.preventDefault();cmRun(cmI)}else if(e.key==='Escape'){cmClose()}});
$('#cml').addEventListener('click',e=>{const l=e.target.closest('li[data-i]');l&&cmRun(+l.dataset.i)});cmd.addEventListener('click',e=>{if(e.target===cmd)cmClose()});
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();cmd.hidden?cmOpen():cmClose()}});
